name: Compilar widget Android
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Descomprimir y compilar
        run: |
          unzip -q mi-trakt-widget.zip
          cd mi-trakt-widget
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mi-trakt-widget-apk
          path: mi-trakt-widget/app/build/outputs/apk/debug/app-debug.apk
