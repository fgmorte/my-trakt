<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16131d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mi Trakt</title>
<style>
:root{--bg:#f4f1f6;--card:#fff;--tx:#1d1a24;--mu:#6d6778;--ac:#d6336c;--on:#fff;--ln:#e3dfea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16131d;--card:#221e2c;--tx:#efebf5;--mu:#9d96ac;--ac:#ff6b9a;--ln:#332d40;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1{font:700 26px Georgia,serif;margin:0;padding:18px 16px 8px}
main{max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 8px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav .ic{font-size:20px;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--tx);font-weight:700}
nav button.on .ic{filter:none;opacity:1}
nav button.on::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--ac)}
.sec{padding:18px 16px 4px;font-size:18px;font-weight:800}
.it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.it img,.ph{width:72px;height:108px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
.it div{flex:1;min-width:0}
.t{font-weight:700;font-size:16px}.s{color:var(--mu);font-size:13px}.sub{font-weight:700;font-size:13px;margin-top:2px}
.bar{height:4px;background:var(--ln);border-radius:2px;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.b{display:inline-block;margin:8px 6px 0 0;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:600}
.b.f{background:var(--ac);border-color:var(--ac);color:var(--on)}
.b:disabled{opacity:.5}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:20px;font-weight:800;align-self:center}
.chk:active,.chk:disabled{background:var(--ac);color:var(--on)}
input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.box{padding:16px}.box label{font-size:13px;color:var(--mu)}
.msg{padding:24px 16px;color:var(--mu)}
.code{font:700 32px Georgia,serif;letter-spacing:4px;background:var(--ac);color:var(--on);display:inline-block;padding:4px 12px;border-radius:8px;margin:8px 0}
a{color:var(--tx);text-decoration:underline var(--ac)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#toast button{color:var(--ac)!important}
[data-o]{cursor:pointer}
details{border-bottom:1px solid var(--ln);padding:8px 16px}summary{padding:8px 0;font-weight:700}
.ok{color:var(--ac);font-weight:700;padding:0 6px}
.b.pl{padding:4px 10px;font-size:12px;margin-top:6px}
[hidden]{display:none!important}
input[type=checkbox]{width:auto;margin:0 10px 0 0}
.chkrow{display:flex;align-items:center;padding:6px 0;color:var(--tx);font-size:15px}
.pp{display:flex;gap:10px;align-items:center;padding:6px 0}
.pp img,.pp .av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--card);flex:none}
.pp div{flex:1;min-width:0}.pp b{display:block}.pp span{color:var(--mu);font-size:13px}
.kv{padding:8px 0;border-bottom:1px solid var(--ln)}.kv span{display:block;color:var(--mu);font-size:12px}
#intro{position:fixed;inset:0;z-index:99;background:#0b0710;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
#intro>*{position:relative;z-index:2}
#intro .scan{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
#intro .sun{position:absolute;z-index:1;width:220px;height:220px;border-radius:50%;bottom:30%;background:linear-gradient(#ffb3cd,#ff3d81 55%,#9c0f4f);-webkit-mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px);mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px);animation:rise 1.1s ease-out both}
#intro .grid{position:absolute;z-index:1;left:-60%;right:-60%;bottom:0;height:38%;background:repeating-linear-gradient(90deg,rgba(255,107,154,.75) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgba(255,107,154,.75) 0 2px,transparent 2px 36px);transform:perspective(260px) rotateX(62deg);transform-origin:bottom;animation:gridm .6s linear infinite}
#intro .ttl{font:900 46px Impact,"Arial Black",sans-serif;letter-spacing:4px;color:#fff;text-shadow:0 0 6px #ff6b9a,0 0 18px #ff2e7e,0 0 40px #ff2e7e;animation:flick 1.6s both}
#intro .sub2{font:700 12px "Trebuchet MS",sans-serif;letter-spacing:3px;color:#efebf5;animation:fadei .6s .6s both}
#intro .play{font:700 18px "Trebuchet MS",sans-serif;color:#16131d;background:#ff6b9a;padding:6px 18px;border-radius:4px;box-shadow:0 0 16px #ff2e7e;animation:fadei .3s 1s both,blink .6s steps(2) 1.3s 2}
@keyframes gridm{to{background-position:0 0,0 36px}}
@keyframes flick{0%{opacity:0}10%{opacity:1}14%{opacity:.2}18%{opacity:1}22%{opacity:.4}26%,100%{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes fadei{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:80;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:94%;max-height:90%;border-radius:10px}
img[data-z]{cursor:zoom-in}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:4px 0 14px}
.seg{display:flex;background:var(--card);border-radius:99px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:99px;font:inherit;font-weight:700}
.seg button.on{background:var(--ac);color:var(--on)}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="scan"></div><div class="sun"></div><div class="grid"></div><div class="ttl">MI TRAKT</div><div class="sub2">SERIES · PELÍCULAS · SESIÓN CONTINUA</div><div class="play">▶ PLAY</div></div>
<main><h1 id="h">Mi Trakt</h1><div id="v"></div></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_CID='2dFp8k9VZWx3_XvbbQM06P1QBG9TcB-LGik30OrzWuQ';
const DEFAULT_TMDB='1ecd17043eeaf60425225d378af33c0a';
let cfg=Object.assign({cid:DEFAULT_CID,tmdb:DEFAULT_TMDB},ls.get('cfg')||{}), tok=ls.get('tok'), tab=tok?'prog':'cfg';
if(!cfg.cid)cfg.cid=DEFAULT_CID;
if(!cfg.tmdb)cfg.tmdb=DEFAULT_TMDB;
const posters=ls.get('posters')||{};
const API='https://api.trakt.tv';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,undo){
  const t=$('#toast');t.textContent=m;t.style.pointerEvents=undo?'auto':'none';
  if(undo){const b=document.createElement('button');b.textContent='Deshacer';b.style.cssText='margin-left:12px;border:0;background:none;color:var(--ac);font:inherit;font-weight:700';b.onclick=()=>{t.classList.remove('on');undo()};t.appendChild(b)}
  t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),undo?6000:2000);
}

async function refreshTok(){
  if(!tok||!tok.refresh_token)return false;
  try{
    const r=await fetch(API+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:tok.refresh_token,client_id:cfg.cid,redirect_uri:'http://localhost',grant_type:'refresh_token'})});
    if(!r.ok)return false;
    tok=await r.json();ls.set('tok',tok);return true;
  }catch(e){return false}
}
async function tr(path,opt={}){
  const h={'Content-Type':'application/json','trakt-api-version':'2','trakt-api-key':cfg.cid};
  if(tok)h.Authorization='Bearer '+tok.access_token;
  const r=await fetch(API+path,{method:opt.body?'POST':'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401&&tok&&!opt.retried&&await refreshTok())return tr(path,Object.assign({},opt,{retried:true}));
  if(r.status===401&&tok){tok=null;ls.set('tok',null);const ae=new Error('Sesión caducada. Vuelve a conectar con Trakt.');ae.auth=true;throw ae}
  if(!r.ok)throw new Error('Trakt respondió '+r.status);
  return r.json();
}
async function poster(kind,tmdb){
  if(!cfg.tmdb||!tmdb)return '';
  const k=kind+tmdb;
  if(posters[k]!==undefined)return posters[k];
  try{
    const r=await fetch(`https://api.themoviedb.org/3/${kind==='movie'?'movie':'tv'}/${tmdb}?api_key=${encodeURIComponent(cfg.tmdb)}`);
    const d=await r.json();
    posters[k]=d.poster_path?'https://image.tmdb.org/t/p/w185'+d.poster_path:'';
    ls.set('posters',posters);
  }catch(e){posters[k]=''}
  return posters[k];
}

// Normaliza cualquier respuesta de Trakt a {kind,o,ep,date}
function norm(x){
  if(x.episode&&x.show)return{kind:'episode',o:x.show,ep:x.episode,date:x.watched_at||x.first_aired};
  if(x.movie)return{kind:'movie',o:x.movie,date:x.watched_at||x.listed_at};
  if(x.show)return{kind:'show',o:x.show,date:x.listed_at};
  return null;
}
const fmt=d=>d?new Date(d).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}):'';

function card(n,btns,idx){
  const o=n.o,pad=x=>String(x).padStart(2,'0');
  const sub=n.kind==='group'?n.sub:n.kind==='episode'?`T${pad(n.ep.season)} | E${pad(n.ep.number)}`:(n.kind==='movie'?'Película':'Serie');
  const ept=n.kind==='episode'&&n.ep.title?`<div class="s">${esc(n.ep.title)}</div>`:'';
  const bar=n.pct!=null?`<div class="bar"><i style="width:${n.pct}%"></i></div>`:'';
  const chk=btns.find(b=>b[0]==='seen');
  const bt=btns.filter(b=>b!==chk).map(b=>`<button class="b ${b[2]||''}" data-a="${b[0]}" data-i="${idx}">${b[1]}</button>`).join('');
  return `<div class="it"><div class="ph" data-o="${idx}" data-p="${n.kind==='movie'?'movie':'tv'}:${o.ids.tmdb||''}"></div><div><div class="t" data-o="${idx}">${esc(o.title)}${n.kind==='episode'?'':` <span class="s">${o.year||''}</span>`}</div><div class="sub">${esc(sub)}</div>${ept}${bar}<div class="s">${n.extra||fmt(n.date)}</div>${bt}</div>${chk?`<button class="chk" data-a="seen" data-i="${idx}" aria-label="Marcar como visto">✓</button>`:''}</div>`;
}
let items=[];
async function render(list,btnsFor,empty,pre){
  items=pre||list.map(norm).filter(Boolean);
  $('#v').innerHTML=items.length?items.map((n,i)=>n.kind==='head'?`<div class="sec">${n.t}</div>`:card(n,btnsFor(n),i)).join(''):`<div class="msg">${empty}</div>`;
  document.querySelectorAll('[data-p]').forEach(async el=>{
    const [k,id]=el.dataset.p.split(':');const u=await poster(k,id);
    if(u)el.outerHTML=imgTag(u,el);
  });
}
const WATCH=['seen','Visto','f'], LATER=['later','+ Pendiente'];
const ST={hist:{shows:[],movies:[],seg:'show',q:'',found:[]},wl:{shows:[],movies:[],seg:'show',q:'',found:[]}};
const SEEN={s:new Set(),c:new Set(),m:new Set()};
const WL={s:new Set(),m:new Set(),ok:false};
const cur=()=>ST[tab];
async function loadWL(){
  if(WL.ok)return;
  const [a,b]=await Promise.all([tr('/sync/watchlist/shows'),tr('/sync/watchlist/movies')]);
  WL.s=new Set(a.map(x=>x.show.ids.trakt));WL.m=new Set(b.map(x=>x.movie.ids.trakt));WL.ok=true;
}
const following=n=>(n.kind==='movie'?WL.m:WL.s).has(n.o.ids.trakt);
const FOLLOW=n=>following(n)?['follow','✓ Siguiendo','f']:['follow','+ Seguir'];
function listBtns(n){
  if(tab==='hist')return n.kind==='movie'?[['undo','Quitar de vistos']]:[];
  return n.kind==='movie'?[WATCH,FOLLOW(n)]:[FOLLOW(n)];
}
function foundBtns(n){
  if(tab==='hist'&&n.seen)return [];
  return n.kind==='movie'?[WATCH,FOLLOW(n)]:[FOLLOW(n)];
}
function paintList(){
  const S=cur(),q=S.q.trim().toLowerCase();
  const local=(S.seg==='show'?S.shows:S.movies).filter(n=>!q||n.o.title.toLowerCase().includes(q));
  items=[...local,...S.found];
  let html=local.length?local.map((n,i)=>card(n,listBtns(n),i)).join(''):`<div class="msg">${q?'Ninguna coincidencia. Pulsa Intro para buscarla en Trakt.':'Aún no hay nada aquí.'}</div>`;
  if(S.found.length)html+='<div class="sec">Resultados en Trakt</div>'+S.found.map((n,i)=>card(n,foundBtns(n),local.length+i)).join('');
  $('#hl').innerHTML=html;loadPosters();
  document.querySelectorAll('[data-sg]').forEach(b=>b.classList.toggle('on',b.dataset.sg===S.seg));
}
function listShell(ph){
  const S=cur();
  $('#v').innerHTML=`<div class="box" style="padding-bottom:0"><div class="seg"><button data-sg="show">Series (${S.shows.length})</button><button data-sg="movie">Películas (${S.movies.length})</button></div><input id="hq" type="search" placeholder="${ph}" enterkeyhint="search" value="${esc(S.q)}"></div><div id="hl"></div>`;
  $('#hq').addEventListener('input',e=>{S.q=e.target.value;S.found=[];paintList()});
  $('#hq').addEventListener('keydown',e=>{if(e.key==='Enter')searchList(e.target.value)});
  paintList();
}
async function searchList(q){
  q=q.trim();if(!q)return;const S=cur();
  $('#hl').innerHTML='<div class="msg">Buscando…</div>';
  try{
    const d=await tr(`/search/show,movie?query=${encodeURIComponent(q)}&limit=10`);
    S.found=d.map(norm).filter(Boolean).map(n=>{
      const isM=n.kind==='movie';
      if(tab==='hist'){const id=n.o.ids.trakt;n.seen=isM?SEEN.m.has(id):SEEN.c.has(id);n.extra=isM?(n.seen?'✓ Ya la has visto':'Sin ver'):(n.seen?'✓ Serie completa':SEEN.s.has(id)?'En curso: aparece en Siguiente':'Sin ver')}
      else n.extra=following(n)?'✓ Ya la sigues':'No la sigues';
      return n;
    });
    if(!S.found.length)toast('Sin resultados en Trakt');
  }catch(err){toast(err.message);S.found=[]}
  paintList();
}
async function tmdbInfo(kind,id){
  if(!cfg.tmdb||!id)return null;
  try{const r=await fetch(`https://api.themoviedb.org/3/${kind}/${id}?api_key=${encodeURIComponent(cfg.tmdb)}&language=${encodeURIComponent(navigator.language||'es-ES')}&append_to_response=credits`);return r.ok?await r.json():null}catch(e){return null}
}
const JOBES={Director:'Dirección',Writer:'Guion',Screenplay:'Guion','Executive Producer':'Productor/a ejecutivo/a',Producer:'Producción','Original Music Composer':'Música','Director of Photography':'Fotografía'};
function tabsHtml(tm,isM){
  if(!tm)return '';
  const person=(nm,sub,pp)=>`<div class="pp">${pp?`<img src="https://image.tmdb.org/t/p/w92${pp}" alt="" loading="lazy">`:'<div class="av"></div>'}<div><b>${esc(nm)}</b><span>${esc(sub||'')}</span></div></div>`;
  const cr=tm.credits||{},cast=(cr.cast||[]).slice(0,24).map(c=>person(c.name,c.character,c.profile_path)).join('');
  const seen=new Set(),eq=[];
  (tm.created_by||[]).forEach(c=>eq.push(person(c.name,'Creación',c.profile_path)));
  (cr.crew||[]).filter(c=>JOBES[c.job]).forEach(c=>{const k=c.id+c.job;if(!seen.has(k)&&eq.length<24){seen.add(k);eq.push(person(c.name,JOBES[c.job],c.profile_path))}});
  const rows=[],li=(t,v)=>{if(v)rows.push(`<div class="kv"><span>${t}</span>${v}</div>`)};
  const names=a=>(a||[]).map(x=>esc(x.name)).join(', ');
  li('Productoras',names(tm.production_companies));li('Cadenas',names(tm.networks));
  li('Países',names(tm.production_countries)||esc((tm.origin_country||[]).join(', ')));
  li('Idioma original',esc(tm.original_language||''));li('Estado',esc(tm.status||''));
  if(isM){li('Estreno',fmt(tm.release_date));li('Presupuesto',tm.budget?'$'+tm.budget.toLocaleString('es'):'');li('Recaudación',tm.revenue?'$'+tm.revenue.toLocaleString('es'):'')}
  else{li('Primera emisión',fmt(tm.first_air_date));li('Última emisión',fmt(tm.last_air_date));li('Temporadas',tm.number_of_seasons);li('Episodios',tm.number_of_episodes)}
  if(/^https:\/\//.test(tm.homepage||''))li('Web oficial',`<a href="${esc(tm.homepage)}" target="_blank" rel="noopener noreferrer">${esc(tm.homepage)}</a>`);
  const E=t=>`<div class="msg">${t}</div>`;
  return `<div class="box"><div class="seg"><button data-tb="0" class="on">Reparto</button><button data-tb="1">Equipo</button><button data-tb="2">Producción</button></div>
  <div data-pane="0">${cast||E('Sin datos de reparto.')}</div><div data-pane="1" hidden>${eq.join('')||E('Sin datos del equipo.')}</div><div data-pane="2" hidden>${rows.join('')||E('Sin datos de producción.')}</div></div>`;
}
function calCard(g,i){
  const o=g.o,now=new Date(),f=g.eps[0],pad=x=>String(x).padStart(2,'0');
  const rows=g.eps.map(n=>{
    const t=new Date(n.date),aired=t<=now;
    return `<div class="it" style="padding:8px 0"><div><span class="t">T${pad(n.ep.season)} | E${pad(n.ep.number)}</span> ${esc(n.ep.title||'')}<div class="s">${aired?'Emitido el ':'Se emite el '}${fmt(n.date)}${aired?'':' · '+t.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div></div>${aired?`<button class="chk" data-e="${n.ep.ids.trakt}" aria-label="Marcar como visto">✓</button>`:''}</div>`;
  }).join('');
  const st=new Date(f.date)<=now?'Ya emitido':'Próximo: '+fmt(f.date);
  return `<div class="it"><div class="ph" data-o="${i}" data-p="tv:${o.ids.tmdb||''}"></div><div><div class="t" data-o="${i}">${esc(o.title)}</div><div class="sub">${g.eps.length} ${g.eps.length===1?'episodio':'episodios'} · ${st}</div><details style="border:0;padding:0"><summary>Ver episodios</summary>${rows}</details></div></div>`;
}
const wcount=x=>(x.seasons||[]).filter(q=>q.number>0).reduce((t,q)=>t+q.episodes.length,0);
const isComplete=x=>{const a=x.show.aired_episodes;return a>0&&wcount(x)>=a};
let progData=[];
const progPath=id=>`/shows/${id}/progress/watched`;
function drawProg(){
  const mk=r=>({kind:'episode',o:r.show,ep:r.p.next_episode,date:null,pct:r.p.aired?Math.round(r.p.completed/r.p.aired*100):0,extra:r.p.completed?`${r.p.completed} de ${r.p.aired} episodios vistos · último: ${fmt(r.p.last_watched_at)}`:'Pendiente de empezar'});
  const st=progData.filter(r=>r.p.completed).sort((x,y)=>(y.p.last_watched_at||'').localeCompare(x.p.last_watched_at||''));
  const a=st.slice(0,25).map(mk),b=st.slice(25).map(mk),c=progData.filter(r=>!r.p.completed).map(mk);
  const hd=(t,l)=>l.length?[{kind:'head',t:`${t} (${l.length})`},...l]:[];
  return render(null,()=>[WATCH],'Estás al día con todas tus series.',[...hd('Para ver ahora',a),...hd('Llevas tiempo sin verlas',b),...hd('Sin empezar',c)]);
}
const views={
  async prog(){
    const [w,wl]=await Promise.all([tr('/sync/watched/shows?extended=full'),tr('/sync/watchlist/shows').catch(()=>[])]);
    w.sort((a,b)=>(b.last_watched_at||'').localeCompare(a.last_watched_at||''));
    const seen=new Set(w.map(x=>x.show.ids.trakt));
    const todo=w.filter(x=>!isComplete(x)).map(x=>x.show).concat(wl.map(x=>x.show).filter(x=>!seen.has(x.ids.trakt)));
    const res=[];
    for(let i=0;i<todo.length;i+=8){
      res.push(...await Promise.all(todo.slice(i,i+8).map(x=>tr(progPath(x.ids.trakt)).then(p=>({show:x,p})).catch(()=>null))));
    }
    progData=res.filter(r=>r&&r.p.next_episode);
    await drawProg();
  },
  async hist(){
    const [sh,mv]=await Promise.all([tr('/sync/watched/shows?extended=full'),tr('/sync/watched/movies'),loadWL().catch(()=>{})]);
    const by=(a,b)=>(b.last_watched_at||'').localeCompare(a.last_watched_at||'');
    sh.sort(by);mv.sort(by);
    const done=sh.filter(isComplete);
    SEEN.s=new Set(sh.map(x=>x.show.ids.trakt));SEEN.c=new Set(done.map(x=>x.show.ids.trakt));SEEN.m=new Set(mv.map(x=>x.movie.ids.trakt));
    const S=ST.hist;
    S.shows=done.map(x=>({kind:'group',o:x.show,date:x.last_watched_at,sub:`Completa · ${x.show.aired_episodes} episodios`,extra:'Último: '+fmt(x.last_watched_at)}));
    S.movies=mv.map(x=>({kind:'movie',o:x.movie,date:x.last_watched_at,extra:x.plays>1?`Vista ${x.plays} veces · última: ${fmt(x.last_watched_at)}`:'Vista el '+fmt(x.last_watched_at)}));
    S.found=[];
    listShell('Buscar en tus vistos o en Trakt');
  },
  async wl(){
    const [a,b]=await Promise.all([tr('/sync/watchlist/shows'),tr('/sync/watchlist/movies')]);
    const by=(x,y)=>(y.listed_at||'').localeCompare(x.listed_at||'');
    a.sort(by);b.sort(by);
    WL.s=new Set(a.map(x=>x.show.ids.trakt));WL.m=new Set(b.map(x=>x.movie.ids.trakt));WL.ok=true;
    const S=ST.wl;
    S.shows=a.map(x=>({kind:'show',o:x.show,date:x.listed_at,extra:'Añadida el '+fmt(x.listed_at)}));
    S.movies=b.map(x=>({kind:'movie',o:x.movie,date:x.listed_at,extra:'Añadida el '+fmt(x.listed_at)}));
    S.found=[];
    listShell('Buscar en tus pendientes o en Trakt');
  },
  async cal(){
    const d0=new Date().toISOString().slice(0,10);
    const d=await tr(`/calendars/my/shows/${d0}/30`);
    const g={},out=[];
    d.map(norm).filter(Boolean).forEach(n=>{
      const k=n.o.ids.trakt;
      if(!g[k]){g[k]={kind:'group',o:n.o,eps:[],date:n.date};out.push(g[k])}
      g[k].eps.push(n);
    });
    out.forEach(x=>x.eps.sort((a,b)=>new Date(a.date)-new Date(b.date)));
    out.sort((a,b)=>new Date(a.eps[0].date)-new Date(b.eps[0].date));
    items=out;
    $('#v').innerHTML=out.length?out.map((x,i)=>calCard(x,i)).join(''):'<div class="msg">No hay episodios de tus series en los próximos 30 días.</div>';
    loadPosters();
  },
  async disc(){
    await loadWL().catch(()=>{});
    $('#v').innerHTML=`<div class="box"><div class="seg"><button data-ds="t" class="on">Tendencias</button><button data-ds="n">Estrenos del mes</button></div><input id="q" type="search" placeholder="Buscar series o películas" enterkeyhint="search"></div><div id="r"></div>`;
    $('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value)});
    await trending();
  }
};
async function trending(){
  const [m,s]=await Promise.all([tr('/movies/trending?limit=10'),tr('/shows/trending?limit=10')]);
  const box=document.createElement('div');
  await renderInto([...m,...s],'Tendencias');
}
async function premieres(){
  const d0=new Date().toISOString().slice(0,10);
  const [a,b]=await Promise.all([tr(`/calendars/all/shows/new/${d0}/30`),tr(`/calendars/all/movies/${d0}/30`)]);
  const all=[...a.map(x=>({kind:'show',o:x.show,date:x.first_aired,extra:'Estreno: '+fmt(x.first_aired)})),...b.map(x=>({kind:'movie',o:x.movie,date:x.released,extra:'Estreno: '+fmt(x.released)}))]
    .filter(x=>x.o&&x.o.ids).sort((x,y)=>String(x.date).localeCompare(String(y.date))).slice(0,80);
  await renderInto(null,'No hay estrenos en los próximos 30 días.',all);
}
async function search(q){
  q=q.trim();if(!q)return;
  const d=await tr(`/search/movie,show?query=${encodeURIComponent(q)}&limit=15`);
  await renderInto(d,'Sin resultados.');
}
async function renderInto(list,label,pre){
  items=pre||list.map(norm).filter(Boolean);
  const html=items.map((n,i)=>card(n,[FOLLOW(n)],i)).join('');
  $('#r').innerHTML=items.length?html:`<div class="msg">${label}</div>`;
  document.querySelectorAll('#r [data-p]').forEach(async el=>{
    const [k,id]=el.dataset.p.split(':');const u=await poster(k,id);
    if(u)el.outerHTML=imgTag(u,el);
  });
}

const imgTag=(u,el)=>`<img src="${u}" alt="" loading="lazy"${el.dataset.o!==undefined?` data-o="${el.dataset.o}"`:''}${el.dataset.z?' data-z="1"':''}>`;
function loadPosters(){
  document.querySelectorAll('[data-p]').forEach(async el=>{
    const [k,id]=el.dataset.p.split(':');const u=await poster(k,id);
    if(u)el.outerHTML=imgTag(u,el);
  });
}
async function openDetail(n){
  const o=n.o,isM=n.kind==='movie',base=(isM?'/movies/':'/shows/')+o.ids.trakt,kd=isM?'movie':'tv';
  $('#h').textContent=o.title;
  $('#v').innerHTML='<div class="msg">Cargando…</div>';
  try{
    const [d,tx,pr,se,tm]=await Promise.all([
      tr(base+'?extended=full'),
      tr(base+'/translations/es').catch(()=>[]),
      isM?null:tr(base+'/progress/watched?specials=false').catch(()=>null),
      isM?null:tr(base+'/seasons?extended=episodes').catch(()=>[]),
      tmdbInfo(kd,o.ids.tmdb),
      loadWL().catch(()=>{})
    ]);
    const ov=(tx[0]&&tx[0].overview)||d.overview||'Sin sinopsis.';
    const meta=[d.rating?'★ '+d.rating.toFixed(1):'',d.runtime?d.runtime+' min':'',d.status,d.network,(d.genres||[]).slice(0,3).join(', ')].filter(Boolean).join(' · ');
    const fol=(isM?WL.m:WL.s).has(o.ids.trakt);
    const done={};
    if(pr)(pr.seasons||[]).forEach(s=>s.episodes.forEach(x=>{if(x.completed)done[s.number+'-'+x.number]=1}));
    const seasons=(se||[]).filter(s=>s.number>0).map(s=>{
      const eps=(s.episodes||[]).map(x=>{
        const ok=done[s.number+'-'+x.number],fut=x.first_aired&&new Date(x.first_aired)>new Date();
        return `<div class="it" style="padding:8px 0"><div><span class="t">E${x.number}</span> ${esc(x.title||'')}<div class="s">${fut?'Se emite el '+fmt(x.first_aired):fmt(x.first_aired)}</div></div><span style="flex:none;white-space:nowrap">${ok?`<button class="b f" data-u="${x.ids.trakt}">✓</button>`:fut?'':`<button class="b" data-e="${x.ids.trakt}">Visto</button>`}</span></div>`;
      }).join('');
      const c=(s.episodes||[]).filter(x=>done[s.number+'-'+x.number]).length;
      return `<details><summary>Temporada ${s.number} · ${c}/${(s.episodes||[]).length}</summary>${eps}</details>`;
    }).join('');
    $('#v').innerHTML=`<div class="box"><button class="b" id="back">← Volver</button></div>
    <div class="it"><div class="ph" data-z="1" data-p="${kd}:${o.ids.tmdb||''}"></div><div><div class="t">${esc(d.title)} <span class="s">${d.year||''}</span></div><div class="s">${esc(meta)}</div>${pr?`<div class="s">Llevas ${pr.completed} de ${pr.aired} episodios</div>`:''}
    ${isM?`<button class="b f" data-d="seen">Visto</button>`:''}<button class="b ${fol?'f':''}" data-d="follow">${fol?'✓ Siguiendo':'+ Seguir'}</button></div></div>
    <div class="box"><p>${esc(ov)}</p></div>${seasons}${tabsHtml(tm,isM)}`;
    $('#back').onclick=()=>go(tab);
    window._d={isM,id:o.ids.trakt,n};
    loadPosters();
  }catch(err){$('#v').innerHTML=`<div class="msg">${esc(err.message)}</div>`}
}
document.addEventListener('click',async e=>{
  const zm=e.target.closest('img[data-z]');
  if(zm){const z=document.createElement('div');z.className='zoom';const im=document.createElement('img');im.src=zm.src.replace('/w185/','/w780/');im.alt='';z.appendChild(im);z.onclick=()=>z.remove();document.body.appendChild(z);return}
  const sg=e.target.closest('[data-sg]');
  if(sg){const S=cur();S.seg=sg.dataset.sg;S.found=[];return paintList()}
  const tb=e.target.closest('[data-tb]');
  if(tb){document.querySelectorAll('[data-tb]').forEach(b=>b.classList.toggle('on',b===tb));document.querySelectorAll('[data-pane]').forEach(x=>x.hidden=x.dataset.pane!==tb.dataset.tb);return}
  const ds=e.target.closest('[data-ds]');
  if(ds){
    document.querySelectorAll('[data-ds]').forEach(b=>b.classList.toggle('on',b===ds));
    $('#r').innerHTML='<div class="msg">Cargando…</div>';
    try{await (ds.dataset.ds==='n'?premieres():trending())}catch(err){$('#r').innerHTML=`<div class="msg">${esc(err.message)}</div>`}
    return;
  }

  const op=e.target.closest('[data-o]');
  if(op)return openDetail(items[+op.dataset.o]);
  const un=e.target.closest('[data-u]');
  if(un){
    un.disabled=true;
    try{await tr('/sync/history/remove',{body:{episodes:[{ids:{trakt:+un.dataset.u}}]}});un.outerHTML=`<button class="b" data-e="${un.dataset.u}">Visto</button>`;toast('Visto deshecho')}
    catch(err){toast(err.message);un.disabled=false}
    return;
  }
  const ep=e.target.closest('[data-e]');
  if(ep){
    ep.disabled=true;
    try{await tr('/sync/history',{body:{episodes:[{ids:{trakt:+ep.dataset.e}}]}});ep.outerHTML=`<button class="b f" data-u="${ep.dataset.e}">✓</button>`;toast('Marcado como visto')}
    catch(err){toast(err.message);ep.disabled=false}
    return;
  }
  const dd=e.target.closest('[data-d]');
  if(dd){
    const {isM,id}=window._d,ids=[{ids:{trakt:id}}];dd.disabled=true;
    try{
      if(dd.dataset.d==='seen'){await tr('/sync/history',{body:{movies:ids}});dd.textContent='✓ Vista';toast('Marcada como vista')}
      else{
        const set=isM?WL.m:WL.s,on=set.has(id),body=isM?{movies:ids}:{shows:ids};
        await tr(on?'/sync/watchlist/remove':'/sync/watchlist',{body});
        on?set.delete(id):set.add(id);
        dd.textContent=on?'+ Seguir':'✓ Siguiendo';dd.classList.toggle('f',!on);toast(on?'Dejaste de seguirla':'Siguiendo');
      }
    }catch(err){toast(err.message)}
    dd.disabled=false;
    return;
  }
  const b=e.target.closest('[data-a]');if(!b)return;
  const n=items[+b.dataset.i];b.disabled=true;
  try{
    if(b.dataset.a==='undo'){await tr('/sync/history/remove',{body:n.hid?{ids:[n.hid]}:{movies:[{ids:{trakt:n.o.ids.trakt}}]}});toast('Quitada de vistos');return go('hist')}
    const ids={ids:{trakt:(n.kind==='episode'?n.ep:n.o).ids.trakt}};
    if(b.dataset.a==='follow'){
      const isM=n.kind==='movie',set=isM?WL.m:WL.s,id=n.o.ids.trakt,body=isM?{movies:[ids]}:{shows:[ids]},on=set.has(id);
      await tr(on?'/sync/watchlist/remove':'/sync/watchlist',{body});
      on?set.delete(id):set.add(id);
      toast(on?'Dejaste de seguirla':'Siguiendo',async()=>{try{await tr(on?'/sync/watchlist':'/sync/watchlist/remove',{body});on?set.add(id):set.delete(id);toast('Deshecho');go(tab)}catch(err){toast(err.message)}});
      if(tab==='wl'&&on){const S=ST.wl;S.shows=S.shows.filter(x=>x.o.ids.trakt!==id);S.movies=S.movies.filter(x=>x.o.ids.trakt!==id);listShell('Buscar en tus pendientes o en Trakt')}
      else{b.textContent=on?'+ Seguir':'✓ Siguiendo';b.classList.toggle('f',!on);b.disabled=false}
      return;
    }
    if(b.dataset.a==='seen'){
      const hb=n.kind==='episode'?{episodes:[ids]}:{movies:[ids]};
      await tr('/sync/history',{body:hb});
      toast('Marcado como visto',async()=>{try{await tr('/sync/history/remove',{body:hb});toast('Deshecho');go(tab)}catch(err){toast(err.message)}});
      if(tab==='wl'||tab==='cal'||tab==='hist')go(tab);
      else if(tab==='prog'){
        const r=progData.find(r=>r.show.ids.trakt===n.o.ids.trakt);
        try{r.p=await tr(progPath(n.o.ids.trakt));progData=progData.filter(r=>r.p.next_episode);drawProg()}catch(e){go('prog')}
      }
    }else{
      const wb=n.kind==='movie'?{movies:[ids]}:{shows:[ids]};
      await tr('/sync/watchlist',{body:wb});
      toast(n.kind==='movie'?'Añadido a pendientes':'Añadido: aparece en Siguiente',async()=>{try{await tr('/sync/watchlist/remove',{body:wb});toast('Quitado')}catch(err){toast(err.message)}});
    }
  }catch(err){toast(err.message);b.disabled=false}
});

// Conexión con Trakt (device code)
function cfgView(){
  $('#v').innerHTML=`<div class="box">
  <p class="s" style="margin:0 0 10px"><b>${tok?'✓ Conectado a Trakt':'⚠ Sin conexión con Trakt'}</b></p>
  <p class="s">Crea tu app en <a href="https://trakt.tv/oauth/applications" target="_blank" rel="noopener">trakt.tv/oauth/applications</a> (solo necesitas el Client ID) y tu clave gratuita en <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a>. Todo se guarda solo en este dispositivo.</p>
  <label>Trakt Client ID</label><input id="cid" value="${esc(cfg.cid||'')}" autocomplete="off">
  <label>TMDB API key (para las carátulas)</label><input id="tm" value="${esc(cfg.tmdb||'')}" autocomplete="off">
  <label>Mis plataformas de pago</label><div class="pgrid">${platsHtml(PAGO)}</div><label>Plataformas gratuitas</label><div class="pgrid">${platsHtml(GRATIS)}</div><p class="s">Se guardan solo en este dispositivo. De momento no abren nada: se usarán cuando retomemos los enlaces directos.</p>
  <button class="b" id="sv">Guardar ajustes</button><button class="b f" id="con">${tok?'Reconectar con Trakt':'Conectar con Trakt'}</button>
  ${tok?'<button class="b" id="out">Cerrar sesión</button>':''}
  <div style="margin-top:14px"><button class="b" id="inst">📲 Instalar en el móvil</button><div class="s" id="instmsg" style="margin-top:6px"></div></div><div id="dv"></div></div>`;
  $('#con').onclick=connect;
  $('#sv').onclick=()=>{saveCfg();toast('Ajustes guardados')};
  $('#inst').onclick=installApp;
  renderPending();
  if(matchMedia('(display-mode: standalone)').matches){$('#inst').textContent='✓ Ya instalada';$('#inst').disabled=true}
  if($('#out'))$('#out').onclick=()=>{tok=null;ls.set('tok',null);setNav();cfgView()};
}
const PAGO=['Netflix','Prime Video','Disney+','Max','Apple TV+','Movistar Plus+','SkyShowtime','Filmin','Crunchyroll','Atresplayer','Rakuten TV','YouTube'];
const GRATIS=['RTVE Play','Mitele','Samsung TV Plus','Plex','Pluto TV','Atresplayer gratis','YouTube gratis'];
const platsHtml=a=>a.map(n=>`<label class="chkrow"><input type="checkbox" value="${esc(n)}" ${(cfg.plats||[]).includes(n)?'checked':''}>${esc(n)}</label>`).join('');
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('App instalada')});
async function installApp(){
  if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#instmsg').textContent=ios?'En Safari: pulsa Compartir y luego «Añadir a pantalla de inicio».':'En Chrome: abre el menú ⋮ y pulsa «Instalar aplicación» o «Añadir a pantalla de inicio».';
}
function saveCfg(){cfg=Object.assign({},cfg,{cid:$('#cid').value.trim(),tmdb:$('#tm').value.trim(),plats:[...document.querySelectorAll('.pgrid input:checked')].map(x=>x.value)});ls.set('cfg',cfg)}
let pollId=0;
function renderPending(){
  const pd=ls.get('pend'),el=$('#dv');
  if(!el||!pd||Date.now()>pd.exp||tok)return;
  el.innerHTML=`<p>Abre <a href="${esc(pd.url)}" target="_blank" rel="noopener">${esc(pd.url)}</a> e introduce este código:</p><div class="code">${esc(pd.uc)}</div><p class="s">Esperando confirmación… al volver a la app se comprueba solo.</p><button class="b" id="newc">Obtener código nuevo</button>`;
  $('#newc').onclick=connect;
}
async function pollDevice(){
  const my=++pollId;
  try{
    for(;;){
      const pd=ls.get('pend');
      if(my!==pollId||!pd)return;
      if(Date.now()>pd.exp)throw new Error('El código ha caducado. Pulsa «Obtener código nuevo».');
      const p=await fetch(API+'/oauth/device/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:pd.dc,client_id:cfg.cid,code_verifier:pd.ver})});
      if(my!==pollId)return;
      if(p.status===200){tok=await p.json();ls.set('tok',tok);ls.set('pend',null);toast('Conectado');setNav();return go('prog')}
      if(p.status===429){pd.iv+=2;ls.set('pend',pd)}
      else if(p.status!==400)throw new Error('Conexión rechazada ('+p.status+'). Pulsa «Obtener código nuevo».');
      await new Promise(r=>setTimeout(r,pd.iv*1000));
    }
  }catch(err){
    if(my===pollId){ls.set('pend',null);if($('#dv'))$('#dv').innerHTML=`<p class="s">${esc(err.message)}</p><button class="b" id="newc">Obtener código nuevo</button>`;if($('#newc'))$('#newc').onclick=connect}
  }
}
async function connect(){
  saveCfg();
  if(!cfg.cid){toast('Falta el Client ID');return}
  try{
    const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const ver=b64(crypto.getRandomValues(new Uint8Array(64)));
    const chal=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
    const r=await fetch(API+'/oauth/device/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:cfg.cid,code_challenge:chal,code_challenge_method:'S256'})});
    if(!r.ok)throw new Error('Trakt rechazó el Client ID ('+r.status+')');
    const d=await r.json();
    ls.set('pend',{dc:d.device_code,uc:d.user_code,url:d.verification_url,iv:d.interval||5,exp:Date.now()+d.expires_in*1000,ver});
    renderPending();pollDevice();
  }catch(err){$('#dv').innerHTML=`<p class="s">${esc(err.message)}</p>`}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ls.get('pend')&&!tok)pollDevice()});

const TABS=[['prog','Siguiente','📺'],['hist','Visto','🕘'],['wl','Pendientes','🔖'],['cal','Próximos','📅'],['disc','Descubrir','🔍'],['cfg','Ajustes','⚙️']];
function setNav(){$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}"><span class="ic">${t[2]}</span>${t[1]}</button>`).join('')}
$('#nav').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)go(t.dataset.t)});
async function go(t){
  tab=t;setNav();
  $('#h').textContent=TABS.find(x=>x[0]===t)[1];
  if(t==='cfg')return cfgView();
  if(!tok){toast('Conecta primero tu cuenta de Trakt');tab='cfg';setNav();return cfgView()}
  $('#v').innerHTML='<div class="msg">Cargando…</div>';
  try{await views[t]()}catch(err){if(err.auth){tab='cfg';setNav();$('#h').textContent='Ajustes';cfgView();toast(err.message)}else $('#v').innerHTML=`<div class="msg">${esc(err.message)}</div>`}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{localStorage.removeItem('prov');localStorage.removeItem('lk')}catch(e){}
(function(){const i=$('#intro');if(!i)return;const end=()=>{i.classList.add('out');setTimeout(()=>i.remove(),600)};i.onclick=end;setTimeout(end,2300)})();
if(ls.get('pend')&&!tok)pollDevice();
go(tab);
</script>
