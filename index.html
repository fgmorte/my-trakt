<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16131d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mi Trakt</title>
<style>
:root{--bg:#f4f1f6;--card:#fff;--tx:#1d1a24;--mu:#6d6778;--ac:#d6336c;--on:#fff;--ln:#e3dfea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16131d;--card:#221e2c;--tx:#efebf5;--mu:#9d96ac;--ac:#ff6b9a;--ln:#332d40;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1{font:700 26px Georgia,serif;margin:0;padding:18px 16px 8px}
main{max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 8px;font:inherit;font-size:10.5px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
nav .ic{display:block;line-height:0;color:var(--mu)}
nav .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);font-weight:700}
nav button.on .ic{color:var(--ac)}
nav button.on::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--ac)}
.sec{padding:18px 16px 4px;font-size:18px;font-weight:800}
.it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.it img,.ph{width:72px;height:108px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
.it div{flex:1;min-width:0}
#fl>.it{content-visibility:auto;contain-intrinsic-size:auto 132px}
.t{font-weight:700;font-size:16px}.s{color:var(--mu);font-size:13px}.sub{font-weight:700;font-size:13px;margin-top:2px}
.bar{height:4px;background:var(--ln);border-radius:2px;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.b{display:inline-block;margin:6px 5px 0 0;padding:3px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:12px;font-weight:600;line-height:1.4}
.b.f{background:var(--ac);border-color:var(--ac);color:var(--on)}
.b:disabled{opacity:.5}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);font-size:15px;font-weight:800;align-self:center}
.chk:active,.chk:disabled{background:var(--ac);color:var(--on)}
input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.box{padding:16px}.box label{font-size:13px;color:var(--mu)}
.msg{padding:24px 16px;color:var(--mu)}
.code{font:700 32px Georgia,serif;letter-spacing:4px;background:var(--ac);color:var(--on);display:inline-block;padding:4px 12px;border-radius:8px;margin:8px 0}
a{color:var(--tx);text-decoration:underline var(--ac)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#toast button{color:var(--ac)!important}
[data-o]{cursor:pointer}
details{border-bottom:1px solid var(--ln);padding:8px 16px}summary{padding:8px 0;font-weight:700}
[hidden]{display:none!important}
input[type=checkbox]{width:auto;margin:0 10px 0 0}
.chkrow{display:flex;align-items:center;padding:6px 0;color:var(--tx);font-size:15px}
.pp{display:flex;gap:10px;align-items:center;padding:6px 0}
.pp img,.pp .av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--card);flex:none}
.pp div{flex:1;min-width:0}.pp b{display:block}.pp span{color:var(--mu);font-size:13px}
.kv{padding:8px 0;border-bottom:1px solid var(--ln)}.kv span{display:block;color:var(--mu);font-size:12px}
#intro{position:fixed;inset:0;z-index:99;background:#0b0710;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;transition:opacity .5s}
#intro.out{opacity:0;pointer-events:none}
#intro>*{position:relative;z-index:2}
#intro .scan{position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
#intro .sun{position:absolute;z-index:1;width:220px;height:220px;border-radius:50%;bottom:30%;background:linear-gradient(#ffb3cd,#ff3d81 55%,#9c0f4f);-webkit-mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px);mask-image:repeating-linear-gradient(#000 0 14px,transparent 14px 19px);animation:rise 1.1s ease-out both}
#intro .grid{position:absolute;z-index:1;left:-60%;right:-60%;bottom:0;height:38%;background:repeating-linear-gradient(90deg,rgba(255,107,154,.75) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgba(255,107,154,.75) 0 2px,transparent 2px 36px);transform:perspective(260px) rotateX(62deg);transform-origin:bottom;animation:gridm .6s linear infinite}
#intro .ttl{font:900 46px Impact,"Arial Black",sans-serif;letter-spacing:4px;color:#fff;text-shadow:0 0 6px #ff6b9a,0 0 18px #ff2e7e,0 0 40px #ff2e7e;animation:flick 1.6s both}
#intro .sub2{font:700 12px "Trebuchet MS",sans-serif;letter-spacing:3px;color:#efebf5;animation:fadei .6s .6s both}
#intro .play{font:700 18px "Trebuchet MS",sans-serif;color:#16131d;background:#ff6b9a;padding:6px 18px;border-radius:4px;box-shadow:0 0 16px #ff2e7e;animation:fadei .3s 1s both,blink .6s steps(2) 1.3s 2}
@keyframes gridm{to{background-position:0 0,0 36px}}
@keyframes flick{0%{opacity:0}10%{opacity:1}14%{opacity:.2}18%{opacity:1}22%{opacity:.4}26%,100%{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes fadei{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#intro{display:none}}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:80;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:94%;max-height:90%;border-radius:10px}
img[data-z]{cursor:zoom-in}
[data-ep],[data-tm]{cursor:pointer}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);margin:6px 6px 0 0}
.pick{background:var(--card);border-radius:14px;padding:16px;width:min(86%,340px);display:flex;flex-direction:column;gap:8px;max-height:80%;overflow:auto}
.pick .b{margin:0;padding:8px 12px;font-size:14px;text-align:left}
.plat{font-size:12px;font-weight:700;color:var(--ac);margin-top:4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:4px 0 14px}
.seg{display:flex;background:var(--card);border-radius:99px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:99px;font:inherit;font-weight:700}
.seg button.on{background:var(--ac);color:var(--on)}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="scan"></div><div class="sun"></div><div class="grid"></div><div class="ttl">MI TRAKT</div><div class="sub2">SERIES · PELÍCULAS · SESIÓN CONTINUA</div><div class="play">▶ PLAY</div></div>
<main><h1 id="h">Mi Trakt</h1><div id="v"></div></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_CID='2dFp8k9VZWx3_XvbbQM06P1QBG9TcB-LGik30OrzWuQ';
const DEFAULT_TMDB='1ecd17043eeaf60425225d378af33c0a';
let cfg=Object.assign({cid:DEFAULT_CID,tmdb:DEFAULT_TMDB},ls.get('cfg')||{}), tok=ls.get('tok'), tab=tok?'prog':'cfg';
if(!cfg.cid)cfg.cid=DEFAULT_CID;
if(!cfg.tmdb)cfg.tmdb=DEFAULT_TMDB;
const posters=ls.get('posters')||{};
let WD=null,WM=null,navId=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let pq=0;const pw=[];
async function slot(){if(pq>=6)await new Promise(r=>pw.push(r));pq++}
function freeSlot(){pq--;const n=pw.shift();if(n)n()}
const API='https://api.trakt.tv';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,undo){
  const t=$('#toast');t.textContent=m;t.style.pointerEvents=undo?'auto':'none';
  if(undo){const b=document.createElement('button');b.textContent='Deshacer';b.style.cssText='margin-left:12px;border:0;background:none;color:var(--ac);font:inherit;font-weight:700';b.onclick=()=>{t.classList.remove('on');undo()};t.appendChild(b)}
  t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),undo?6000:2000);
}

let rfp=null;
function refreshTok(){
  if(rfp)return rfp;
  rfp=(async()=>{
    if(!tok||!tok.refresh_token)return false;
    try{
      const r=await fetch(API+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:tok.refresh_token,client_id:cfg.cid,redirect_uri:'http://localhost',grant_type:'refresh_token'})});
      if(!r.ok)return false;
      tok=await r.json();ls.set('tok',tok);return true;
    }catch(e){return false}
  })().finally(()=>{rfp=null});
  return rfp;
}
async function tr(path,opt={}){
  const h={'Content-Type':'application/json','trakt-api-version':'2','trakt-api-key':cfg.cid};
  if(tok)h.Authorization='Bearer '+tok.access_token;
  if(opt.body&&path.startsWith('/sync/history')){WD=null;WM=null;PG.clear()}
  let r;
  for(let a=0;a<3;a++){
    try{r=await fetch(API+path,{method:opt.body?'POST':'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})}
    catch(e){if(opt.body||a===2)throw new Error('No se pudo contactar con Trakt. Comprueba la conexión o inténtalo en unos minutos.');await sleep(900*(a+1));continue}
    if(!opt.body&&a<2&&(r.status===429||r.status>=500)){await sleep((+r.headers.get('retry-after')||1)*1000*(a+1));continue}
    break;
  }
  if(r.status===401&&tok&&!opt.retried&&await refreshTok())return tr(path,Object.assign({},opt,{retried:true}));
  if(r.status===401&&tok){tok=null;ls.set('tok',null);const ae=new Error('Sesión caducada. Vuelve a conectar con Trakt.');ae.auth=true;throw ae}
  if(!r.ok){const er=new Error('Trakt respondió '+r.status);er.status=r.status;throw er}
  return r.json();
}
async function poster(kind,tmdb){
  if(!cfg.tmdb||!tmdb)return '';
  const k=kind+tmdb;
  if(posters[k]!==undefined)return posters[k];
  await slot();
  try{
    const r=await fetch(`https://api.themoviedb.org/3/${kind==='movie'?'movie':'tv'}/${tmdb}?api_key=${encodeURIComponent(cfg.tmdb)}`);
    if(!r.ok)return '';
    const d=await r.json();
    posters[k]=d.poster_path?'https://image.tmdb.org/t/p/w185'+d.poster_path:'';
    clearTimeout(poster.t);poster.t=setTimeout(()=>ls.set('posters',posters),600);
    return posters[k];
  }catch(e){return ''}
  finally{freeSlot()}
}

// Normaliza cualquier respuesta de Trakt a {kind,o,ep,date}
function norm(x){
  if(x.episode&&x.show)return{kind:'episode',o:x.show,ep:x.episode,date:x.watched_at||x.first_aired};
  if(x.movie)return{kind:'movie',o:x.movie,date:x.watched_at||x.listed_at};
  if(x.show)return{kind:'show',o:x.show,date:x.listed_at};
  return null;
}
const fmt=d=>d?new Date(d).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}):'';

let items=[];
async function tmdbInfo(kind,id){
  if(!cfg.tmdb||!id)return null;
  try{const r=await fetch(`https://api.themoviedb.org/3/${kind}/${id}?api_key=${encodeURIComponent(cfg.tmdb)}&language=${encodeURIComponent(navigator.language||'es-ES')}&append_to_response=credits`);return r.ok?await r.json():null}catch(e){return null}
}
const JOBES={Director:'Dirección',Writer:'Guion',Screenplay:'Guion','Executive Producer':'Productor/a ejecutivo/a',Producer:'Producción','Original Music Composer':'Música','Director of Photography':'Fotografía'};
function tabsHtml(tm,isM){
  if(!tm)return '';
  const person=(nm,sub,pp)=>`<div class="pp">${pp?`<img src="https://image.tmdb.org/t/p/w92${pp}" alt="" loading="lazy">`:'<div class="av"></div>'}<div><b>${esc(nm)}</b><span>${esc(sub||'')}</span></div></div>`;
  const cr=tm.credits||{},cast=(cr.cast||[]).slice(0,24).map(c=>person(c.name,c.character,c.profile_path)).join('');
  const seen=new Set(),eq=[];
  (tm.created_by||[]).forEach(c=>eq.push(person(c.name,'Creación',c.profile_path)));
  (cr.crew||[]).filter(c=>JOBES[c.job]).forEach(c=>{const k=c.id+c.job;if(!seen.has(k)&&eq.length<24){seen.add(k);eq.push(person(c.name,JOBES[c.job],c.profile_path))}});
  const rows=[],li=(t,v)=>{if(v)rows.push(`<div class="kv"><span>${t}</span>${v}</div>`)};
  const names=a=>(a||[]).map(x=>esc(x.name)).join(', ');
  li('Productoras',names(tm.production_companies));li('Cadenas',names(tm.networks));
  li('Países',names(tm.production_countries)||esc((tm.origin_country||[]).join(', ')));
  li('Idioma original',esc(tm.original_language||''));li('Estado',esc(tm.status||''));
  if(isM){li('Estreno',fmt(tm.release_date));li('Presupuesto',tm.budget?'$'+tm.budget.toLocaleString('es'):'');li('Recaudación',tm.revenue?'$'+tm.revenue.toLocaleString('es'):'')}
  else{li('Primera emisión',fmt(tm.first_air_date));li('Última emisión',fmt(tm.last_air_date));li('Temporadas',tm.number_of_seasons);li('Episodios',tm.number_of_episodes)}
  if(/^https:\/\//.test(tm.homepage||''))li('Web oficial',`<a href="${esc(tm.homepage)}" target="_blank" rel="noopener noreferrer">${esc(tm.homepage)}</a>`);
  const E=t=>`<div class="msg">${t}</div>`;
  return `<div class="box"><div class="seg"><button data-tb="0" class="on">Reparto</button><button data-tb="1">Equipo</button><button data-tb="2">Producción</button></div>
  <div data-pane="0">${cast||E('Sin datos de reparto.')}</div><div data-pane="1" hidden>${eq.join('')||E('Sin datos del equipo.')}</div><div data-pane="2" hidden>${rows.join('')||E('Sin datos de producción.')}</div></div>`;
}
const wcount=x=>(x.seasons||[]).filter(q=>q.number>0).reduce((t,q)=>t+q.episodes.length,0);
const isComplete=x=>{const a=x.show.aired_episodes;return a>0&&wcount(x)>=a};
const progPath=id=>`/shows/${id}/progress/watched`;
const PG=new Map();
async function progOf(id){
  const c=PG.get(id);if(c&&Date.now()-c.t<3e5)return c.p;
  const p=await tr(progPath(id));PG.set(id,{t:Date.now(),p});return p;
}
const imgTag=(u,el)=>`<img src="${u}" alt="" loading="lazy"${el.dataset.o!==undefined?` data-o="${el.dataset.o}"`:''}${el.dataset.z?' data-z="1"':''}>`;
async function fillPoster(el){
  const [k,id]=el.dataset.p.split(':'),u=await poster(k,id);
  if(u&&el.isConnected)el.outerHTML=imgTag(u,el);
}
const pio='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){pio.unobserve(e.target);fillPoster(e.target)}}),{rootMargin:'300px'}):null;
function loadPosters(){
  document.querySelectorAll('[data-p]:not([data-w])').forEach(el=>{el.dataset.w=1;pio?pio.observe(el):fillPoster(el)});
}
/* ===== Estado y utilidades ===== */
const WATCH=['seen','Visto','f'];
const PROG_BTNS=[WATCH,['play','▶ Ver']];
const SEEN={s:new Set(),c:new Set(),m:new Set()};
const WL={s:new Set(),m:new Set(),ok:false};
const LS2={hist:{shows:[],movies:[],seg:'show',q:''},wl:{shows:[],movies:[],seg:'show',q:''}};
const CAL={seg:'e'};
let detailOpen=false,dpush=0,lastBack=0;
const ENDED=x=>/ended|canceled/i.test((x.show&&x.show.status)||'');
const byDesc=k=>(a,b)=>(b[k]||'').localeCompare(a[k]||'');
async function watchedMovies(){
  if(WM&&Date.now()-WM.t<3e5)return WM.d;
  const d=await tr('/sync/watched/movies');WM={t:Date.now(),d};return d;
}
async function watchedShows(){
  if(WD&&Date.now()-WD.t<3e5)return WD.d;
  const d=await tr('/sync/watched/shows?extended=full');WD={t:Date.now(),d};return d;
}
function setSeen(w,wm){
  SEEN.s=new Set(w.map(x=>x.show.ids.trakt));
  SEEN.c=new Set(w.filter(isComplete).map(x=>x.show.ids.trakt));
  SEEN.m=new Set(wm.map(x=>x.movie.ids.trakt));
}
async function loadSeen(){const [w,wm]=await Promise.all([watchedShows(),watchedMovies()]);setSeen(w,wm)}
async function loadWL(){
  if(WL.ok)return;
  const [a,b]=await Promise.all([tr('/sync/watchlist/shows'),tr('/sync/watchlist/movies')]);
  WL.s=new Set(a.map(x=>x.show.ids.trakt));WL.m=new Set(b.map(x=>x.movie.ids.trakt));WL.ok=true;
}
const following=n=>(n.kind==='movie'?WL.m:WL.s).has(n.o.ids.trakt);
const FOLLOW=n=>following(n)?['follow','✓ Siguiendo','f']:['follow','+ Seguir'];
const seenBtn=n=>SEEN.m.has(n.o.ids.trakt)?['sw','✓ Visto','f']:['sw','Visto'];
function fail(err,el){
  if(err.auth){tab='cfg';setNav();$('#h').textContent='Ajustes';cfgView();toast(err.message);return}
  el.innerHTML=`<div class="msg">${esc(err.message)}<br><button class="b f" id="retry">Reintentar</button></div>`;
  $('#retry').onclick=()=>go(tab);
}

/* ===== Tarjeta ===== */
function card(n,btns,idx){
  const o=n.o,pad=x=>String(x).padStart(2,'0');
  const sub=n.sub||(n.kind==='episode'?`T${pad(n.ep.season)} | E${pad(n.ep.number)}`:n.kind==='movie'?'Película':'Serie');
  const ept=n.kind==='episode'&&n.ep.title?`<div class="s">${esc(n.ep.title)}</div>`:'';
  const air=n.air!==undefined?`<div class="s" data-air="${idx}">${n.air?'Estreno: '+fmt(n.air):''}</div>`:'';
  const bar=n.pct!=null?`<div class="bar"><i style="width:${n.pct}%"></i></div>`:'';
  const pl=n.pl?`<div class="plat" data-pl="${n.kind==='movie'?'movie':'tv'}:${o.ids.tmdb||''}:${idx}"></div>`:'';
  const chk=btns.find(b=>b[0]==='seen');
  const bt=btns.filter(b=>b!==chk).map(b=>`<button class="b ${b[2]||''}" data-a="${b[0]}" data-i="${idx}">${b[1]}</button>`).join('');
  return `<div class="it" data-ci="${idx}"><div class="ph" data-o="${idx}" data-p="${n.kind==='movie'?'movie':'tv'}:${o.ids.tmdb||''}"></div><div><div class="t" data-o="${idx}">${esc(o.title)}${n.kind==='episode'?'':` <span class="s">${o.year||''}</span>`}</div><div class="sub">${esc(sub)}</div>${ept}${air}${bar}<div class="s">${n.extra||fmt(n.date)}</div>${pl}${bt}</div>${chk?`<button class="chk" data-a="seen" data-i="${idx}" aria-label="Marcar como visto">✓</button>`:''}</div>`;
}

/* ===== Plataformas (etiqueta en Próximos) ===== */
const PV=ls.get('prov')||{};
async function wmNames(kind,tmdb){
  try{
    const f=kind==='movie'?'tmdb_movie_id':'tmdb_tv_id',k=encodeURIComponent(cfg.wm);
    const r=await fetch(`https://api.watchmode.com/v1/search/?apiKey=${k}&search_field=${f}&search_value=${tmdb}`);
    if(!r.ok)return [];
    const t=((await r.json()).title_results||[])[0];if(!t)return [];
    const r2=await fetch(`https://api.watchmode.com/v1/title/${t.id}/sources/?apiKey=${k}&regions=${cfg.country||'ES'}`);
    if(!r2.ok)return [];
    return [...new Set((await r2.json()).filter(x=>x.type==='sub'||x.type==='free').map(x=>x.name))];
  }catch(e){return []}
}
async function platNames(kind,tmdb,fallback){
  const k=kind+tmdb,c=PV[k];
  if(c&&Date.now()-c.t<2592e5)return c.n;
  let names=[];
  if(cfg.tmdb){
    try{
      const r=await fetch(`https://api.themoviedb.org/3/${kind}/${tmdb}/watch/providers?api_key=${encodeURIComponent(cfg.tmdb)}`);
      if(!r.ok)return fallback?[fallback]:[];
      const d=await r.json(),z=d.results&&d.results[cfg.country||'ES'];

let feedTok=0,feedIO=null;
function startFeed(root,src,o){
  const my=++feedTok;items=[];
  if(feedIO)feedIO.disconnect();
  root.innerHTML='<div id="fl"></div><div id="fs" class="msg"></div>';
  const fl=$('#fl'),fs=$('#fs');let pos=0,busy=false;
  if(!src.length){fs.textContent=o.empty||'No hay nada que mostrar.';return}
  async function more(){
    if(busy||my!==feedTok||pos>=src.length)return;
    busy=true;fs.textContent='Cargando más…';
    let its;
    try{its=await o.prep(src.slice(pos,pos+o.size))}
    catch(err){if(my===feedTok){busy=false;fail(err,fs)}return}
    if(my!==feedTok)return;
    pos+=o.size;
    fl.insertAdjacentHTML('beforeend',its.map(n=>{items.push(n);const i=items.length-1;return o.html?o.html(n,i):card(n,o.btns(n),i)}).join(''));
    loadPosters();observePl();if(o.after)o.after();
    busy=false;
    if(pos>=src.length){fs.textContent=items.length?'':(o.empty||'No hay nada que mostrar.');feedIO.disconnect()}
    else{fs.textContent='';feedIO.unobserve(fs);feedIO.observe(fs)}
  }
  feedIO=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'500px'});
  feedIO.observe(fs);more();
}

/* ===== Reproducir: enlaces de plataformas (Trakt watchnow y Watchmode) ===== */
const WS_CACHE=new Map();
const imgRe=/\.(png|jpe?g|webp|svg|gif)(\?|$)/i;
function pickUrl(o){
  for(const re of [/android/i,/direct/i,/^(link|url|deeplink|deep_link|web_url)$/i,/link|url/i])
    for(const k in o)if(re.test(k)&&typeof o[k]==='string'&&/^https:\/\//i.test(o[k])&&!imgRe.test(o[k]))return o[k];
  return '';
}
function collectSources(j){
  const out=[],seen=new Set();
  const walk=(v,tag)=>{
    if(Array.isArray(v))return v.forEach(x=>walk(x,tag));
    if(v&&typeof v==='object'){
      const nm=v.name||v.source||v.provider||v.service,url=pickUrl(v);
      if(nm&&typeof nm==='string'&&url&&!seen.has(nm+url)){seen.add(nm+url);out.push({name:nm,url,type:typeof tag==='string'?tag:''})}
      for(const k in v)if(v[k]&&typeof v[k]==='object')walk(v[k],k);
    }
  };
  walk(j,'');return out;
}
const normN=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function rankSources(list){
  const mine=(cfg.plats||[]).map(normN);
  list.forEach(s=>{const n=normN(s.name);s.mine=mine.some(m=>m&&(n.includes(m)||m.includes(n)))});
  return list.sort((a,b)=>b.mine-a.mine);
}
async function traktSources(path){
  const c=(cfg.country||'ES').toLowerCase();
  try{return collectSources(await tr(`${path}/watchnow/${c}?links=android,direct`))}
  catch(err){
    if(err.status===400||err.status===422)return collectSources(await tr(`${path}/watchnow/${c}`));
    throw err;
  }
}
async function wmSources(tmdb,kind){
  if(!cfg.wm||!tmdb)return [];
  try{
    const f=kind==='movie'?'tmdb_movie_id':'tmdb_tv_id',k=encodeURIComponent(cfg.wm);
    const r=await fetch(`https://api.watchmode.com/v1/search/?apiKey=${k}&search_field=${f}&search_value=${tmdb}`);
    if(!r.ok)return [];
    const t=((await r.json()).title_results||[])[0];if(!t)return [];
    const r2=await fetch(`https://api.watchmode.com/v1/title/${t.id}/sources/?apiKey=${k}&regions=${cfg.country||'ES'}`);
    if(!r2.ok)return [];
    return (await r2.json()).filter(x=>x.type==='sub'||x.type==='free').map(x=>{
      const u=[x.android_url,x.web_url].find(v=>typeof v==='string'&&/^https:\/\//i.test(v));
      return u?{name:x.name,url:u,type:x.type==='free'?'gratis':'suscripción'}:null;
    }).filter(Boolean);
  }catch(e){return []}
}
async function findLinks(t){
  const key=t.paths.join('|'),c=WS_CACHE.get(key);
  if(c&&Date.now()-c.t<6e5)return c.v;
  let out=[],limited=false;
  for(const p of t.paths){
    try{out=await traktSources(p);if(out.length)break}
    catch(err){if(err.auth)throw err;if(err.status===403)limited=true}
  }
  if(!out.length)out=await wmSources(t.tmdb,t.kind);
  const v={list:rankSources(out),limited};
  WS_CACHE.set(key,{t:Date.now(),v});return v;
}

    const stt=STAT[(d.status||'').toLowerCase()]||(d.status||'').toUpperCase();
    const prg=pr?(pr.aired>0&&pr.completed>=pr.aired?'VISTO':pr.completed>0?'INICIADO':''):(isM&&SEEN.m.has(o.ids.trakt)?'VISTO':'');
    const chips=[prg,stt].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('');
    const fol=(isM?WL.m:WL.s).has(o.ids.trakt),sn=SEEN.m.has(o.ids.trakt);
    const done={};
    if(pr)(pr.seasons||[]).forEach(s=>s.episodes.forEach(x=>{if(x.completed)done[s.number+'-'+x.number]=1}));
    const seasons=(se||[]).filter(s=>s.number>0).map(s=>{
      const eps=(s.episodes||[]).map(x=>{
        const ok=done[s.number+'-'+x.number],fut=x.first_aired&&new Date(x.first_aired)>new Date(),k=s.number+':'+x.number;
        return `<div class="it" style="padding:8px 0"><div><span class="t" data-ep="${k}">E${x.number} · ${esc(x.title||'')}</span><div class="s">${fut?'Se emite el '+fmt(x.first_aired):fmt(x.first_aired)}</div></div><span style="flex:none;white-space:nowrap">${fut?'':`<button class="b" data-pp="${x.ids.trakt}:${k}" aria-label="Reproducir">▶</button>`}${ok?`<button class="b f" data-u="${x.ids.trakt}">✓ Visto</button>`:fut?'':`<button class="b" data-e="${x.ids.trakt}">Visto</button>`}</span></div>`;
      }).join('');
      const c=(s.episodes||[]).filter(x=>done[s.number+'-'+x.number]).length;
      return `<details><summary>Temporada ${s.number} · ${c}/${(s.episodes||[]).length}</summary>${eps}</details>`;
    }).join('');
    $('#v').innerHTML=`<div class="box"><button class="b" id="back">← Volver</button></div>
    <div class="it"><div class="ph" data-z="1" data-p="${kd}:${o.ids.tmdb||''}"></div><div><div class="t">${esc(d.title)} <span class="s">${d.year||''}</span></div><div class="s">${esc(meta)}</div><div>${chips}</div>${pr?`<div class="s">Llevas ${pr.completed} de ${pr.aired} episodios</div>`:''}
    <button class="b f" data-play="1">▶ Ver</button>${isM?`<button class="b ${sn?'f':''}" data-d="seen">${sn?'✓ Visto':'Visto'}</button>`:''}<button class="b ${fol?'f':''}" data-d="follow">${fol?'✓ Siguiendo':'+ Seguir'}</button></div></div>
    <div class="box"><p>${esc(ov)}</p></div>${seasons}${tabsHtml(tm,isM)}`;
    $('#back').onclick=()=>history.back();
    window._d={isM,id:o.ids.trakt,n};
    loadPosters();
  }catch(err){fail(err,$('#v'))}
}

/* ===== Ficha de episodio ===== */
async function openEpisode(show,sn,en){
  navId++;const my=navId,pad=x=>String(x).padStart(2,'0');
  $('#h').textContent=show.title;
  $('#v').innerHTML='<div class="msg">Cargando…</div>';
  window.scrollTo(0,0);
  if(!detailOpen){history.pushState({d:1},'');dpush++}
  detailOpen=true;
  try{
    const base=`/shows/${show.ids.trakt}/seasons/${sn}/episodes/${en}`;
    const [e,tx,w]=await Promise.all([tr(base+'?extended=full'),tr(base+'/translations/es').catch(()=>[]),tr(`/shows/${show.ids.trakt}/progress/watched?specials=false`).catch(()=>null)]);
    if(my!==navId)return;
    const seen=!!(w&&(w.seasons||[]).some(s=>s.number===sn&&s.episodes.some(x=>x.number===en&&x.completed)));
    const ov=(tx[0]&&tx[0].overview)||e.overview||'Sin descripción.';
    const fut=e.first_aired&&new Date(e.first_aired)>new Date();
    const info=[e.first_aired?(fut?'Se emite el ':'Estreno: ')+fmt(e.first_aired):'',e.runtime?e.runtime+' min':'',e.rating?'★ '+e.rating.toFixed(1):''].filter(Boolean).join(' · ');
    $('#v').innerHTML=`<div class="box"><button class="b" id="back">← Volver a la serie</button></div>
    <div class="box"><div class="sub">T${pad(sn)} | E${pad(en)}</div><div class="t" style="font-size:20px">${esc(e.title||'Episodio '+en)}</div><div class="s">${esc(info)}</div>
    <div style="margin:12px 0">${fut?'':'<button class="b f" data-play2="1">▶ Reproducir</button>'}<button class="b ${seen?'f':''}" data-ev="1">${seen?'✓ Visto':'Visto'}</button></div><p>${esc(ov)}</p></div>`;
    $('#back').onclick=()=>openDetail({kind:'show',o:show});
    window._ep={show,sn,en,id:e.ids.trakt,seen};
  }catch(err){fail(err,$('#v'))}
}

/* ===== Clics ===== */
async function toggleSeenMovie(n,btn){
  const id=n.o.ids.trakt,on=SEEN.m.has(id);
  await tr(on?'/sync/history/remove':'/sync/history',{body:{movies:[{ids:{trakt:id}}]}});
  on?SEEN.m.delete(id):SEEN.m.add(id);
  if(btn){btn.textContent=on?'Visto':'✓ Visto';btn.classList.toggle('f',!on)}
  toast(on?'Desmarcada como vista':'Marcada como vista');
}
async function toggleFollow(n,btn){
  const isM=n.kind==='movie',set=isM?WL.m:WL.s,id=n.o.ids.trakt,ids={ids:{trakt:id}},body=isM?{movies:[ids]}:{shows:[ids]},on=set.has(id);
  await tr(on?'/sync/watchlist/remove':'/sync/watchlist',{body});
  on?set.delete(id):set.add(id);
  btn.textContent=on?'+ Seguir':'✓ Siguiendo';btn.classList.toggle('f',!on);
  toast(on?'Dejaste de seguirla':'Siguiendo');
  return on;
}
document.addEventListener('click',async e=>{
  const T=e.target;let x;
  if((x=T.closest('img[data-z]'))){const z=document.createElement('div');z.className='zoom';const im=document.createElement('img');im.src=x.src.replace('/w185/','/w780/');im.alt='';z.appendChild(im);z.onclick=()=>z.remove();document.body.appendChild(z);return}
  if((x=T.closest('[data-sg]'))){LS2[tab].seg=x.dataset.sg;paintList(tab);return}
  if((x=T.closest('[data-cs]'))){CAL.seg=x.dataset.cs;calRun();return}
  if((x=T.closest('[data-ds]'))){document.querySelectorAll('[data-ds]').forEach(b=>b.classList.toggle('on',b===x));discRun(x.dataset.ds);return}
  if((x=T.closest('[data-tb]'))){document.querySelectorAll('[data-tb]').forEach(b=>b.classList.toggle('on',b===x));document.querySelectorAll('[data-pane]').forEach(p=>{p.hidden=p.dataset.pane!==x.dataset.tb});return}
  if(T.closest('#bk')){paintList(tab);return}
  if((x=T.closest('[data-pp]'))){const [id,sn,en]=x.dataset.pp.split(':'),sh=window._d.n.o;playTitle({paths:['/episodes/'+id,'/shows/'+sh.ids.trakt],tmdb:sh.ids.tmdb,kind:'tv',label:`${sh.title} · T${sn}E${en}`});return}
  if((x=T.closest('[data-ep]'))){const [sn,en]=x.dataset.ep.split(':').map(Number);openEpisode(window._d.n.o,sn,en);return}
  if(T.closest('[data-play]')){playTitle(tgtFor(window._d.n));return}
  if(T.closest('[data-play2]')){const E=window._ep,sh=E.show;playTitle({paths:['/episodes/'+E.id,'/shows/'+sh.ids.trakt],tmdb:sh.ids.tmdb,kind:'tv',label:`${sh.title} · T${E.sn}E${E.en}`});return}
  if((x=T.closest('[data-ev]'))){
    const E=window._ep,on=E.seen;x.disabled=true;
    try{await tr(on?'/sync/history/remove':'/sync/history',{body:{episodes:[{ids:{trakt:E.id}}]}});E.seen=!on;x.textContent=on?'Visto':'✓ Visto';x.classList.toggle('f',!on);toast(on?'Desmarcado':'Marcado como visto')}
    catch(err){toast(err.message)}
    x.disabled=false;return;
  }
  if((x=T.closest('[data-tm]'))){
    const tt=x.dataset.tt||'movie';
    try{const r=await tr(`/search/tmdb/${x.dataset.tm}?type=${tt}`);if(r[0]&&r[0][tt])openDetail({kind:tt,o:r[0][tt]});else toast('Sin ficha en Trakt')}
    catch(err){toast(err.message)}
    return;
  }
  if((x=T.closest('[data-o]'))){const n=items[+x.dataset.o];if(n)openDetail(n);return}
  if((x=T.closest('[data-u]'))){
    x.disabled=true;
    try{await tr('/sync/history/remove',{body:{episodes:[{ids:{trakt:+x.dataset.u}}]}});x.outerHTML=`<button class="b" data-e="${x.dataset.u}">Visto</button>`;toast('Visto deshecho')}
    catch(err){toast(err.message);x.disabled=false}
    return;
  }
  if((x=T.closest('[data-e]'))){
    x.disabled=true;
    try{await tr('/sync/history',{body:{episodes:[{ids:{trakt:+x.dataset.e}}]}});x.outerHTML=`<button class="b f" data-u="${x.dataset.e}">✓ Visto</button>`;toast('Marcado como visto')}
    catch(err){toast(err.message);x.disabled=false}
    return;
  }
  if((x=T.closest('[data-d]'))){
    const {isM,id,n}=window._d;x.disabled=true;
    try{if(x.dataset.d==='seen')await toggleSeenMovie(n,x);else await toggleFollow(n,x)}catch(err){toast(err.message)}
    x.disabled=false;return;
  }
  if((x=T.closest('[data-a]'))){
    const i=+x.dataset.i,n=items[i],a=x.dataset.a;x.disabled=true;
    try{
      if(a==='play'){await playTitle(tgtFor(n))}
      else if(a==='sw')await toggleSeenMovie(n,x);
      else if(a==='follow'){
        const was=await toggleFollow(n,x);
        if(was&&tab==='wl'){
          const id=n.o.ids.trakt,S=LS2.wl;
          S.shows=S.shows.filter(r=>r.o.ids.trakt!==id);S.movies=S.movies.filter(r=>r.o.ids.trakt!==id);
          const el=document.querySelector(`.it[data-ci="${i}"]`);if(el)el.remove();
        }
      }else if(a==='seen'){
        const body={episodes:[{ids:{trakt:n.ep.ids.trakt}}]};
        await tr('/sync/history',{body});
        toast('Marcado como visto',async()=>{try{await tr('/sync/history/remove',{body});await refreshProg(i);toast('Deshecho')}catch(err){toast(err.message)}});
        await refreshProg(i);
        return;
      }
    }catch(err){toast(err.message)}
    x.disabled=false;
  }
});


// Conexión con Trakt (device code)
function cfgView(){
  const CIUDADES=['Cádiz','Ceuta','Córdoba','Granada','Menorca','Montilla','Tenerife','Zaragoza'].sort((a,b)=>a.localeCompare(b,'es'));
  $('#v').innerHTML=`<div class="box">
  <p class="s" style="margin:0 0 10px"><b>${tok?'✓ Conectado a Trakt':'⚠ Sin conexión con Trakt'}</b></p>
  <p class="s">Crea tu app en <a href="https://trakt.tv/oauth/applications" target="_blank" rel="noopener">trakt.tv/oauth/applications</a> (solo necesitas el Client ID) y tu clave gratuita en <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a>. Todo se guarda solo en este dispositivo.</p>
  <label>Trakt Client ID</label><input id="cid" value="${esc(cfg.cid||'')}" autocomplete="off">
  <label>TMDB API key (carátulas, reparto y cartelera)</label><input id="tm" value="${esc(cfg.tmdb||'')}" autocomplete="off">
  <label>Watchmode API key (opcional: enlaces de reproducción y plataformas)</label><input id="wm" value="${esc(cfg.wm||'')}" autocomplete="off" placeholder="Pega aquí tu clave de api.watchmode.com">
  <label>Mis ciudades (cartelera)</label><div class="pgrid cgrid">${platsHtml(CIUDADES,'cities')}</div>
  <label>Mis plataformas de pago</label><div class="pgrid">${platsHtml(PAGO,'plats')}</div>
  <label>Plataformas gratuitas</label><div class="pgrid">${platsHtml(GRATIS,'plats')}</div>
  <p class="s">Se guardan solo en este dispositivo. Si el botón ▶ encuentra una de tus plataformas, la abre directamente.</p>
  <button class="b" id="sv">Guardar ajustes</button><button class="b f" id="con">${tok?'Reconectar con Trakt':'Conectar con Trakt'}</button>
  ${tok?'<button class="b" id="out">Cerrar sesión</button>':''}
  <div style="margin-top:14px"><button class="b" id="inst">📲 Instalar en el móvil</button><div class="s" id="instmsg" style="margin-top:6px"></div></div><div id="dv"></div></div>`;
  $('#con').onclick=connect;
  $('#sv').onclick=()=>{saveCfg();toast('Ajustes guardados')};
  $('#inst').onclick=installApp;
  renderPending();
  if(matchMedia('(display-mode: standalone)').matches){$('#inst').textContent='✓ Ya instalada';$('#inst').disabled=true}
  if($('#out'))$('#out').onclick=()=>{tok=null;ls.set('tok',null);setNav();cfgView()};
}
const PAGO=['Netflix','Prime Video','Disney+','Max','Apple TV+','Movistar Plus+','SkyShowtime','Filmin','Crunchyroll','Atresplayer','Rakuten TV','YouTube'];
const GRATIS=['RTVE Play','Mitele','Samsung TV Plus','Plex','Pluto TV','Atresplayer gratis','YouTube gratis'];
const platsHtml=(a,key)=>a.map(n=>`<label class="chkrow"><input type="checkbox" value="${esc(n)}" ${(cfg[key]||[]).includes(n)?'checked':''}>${esc(n)}</label>`).join('');

let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('App instalada')});
async function installApp(){
  if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#instmsg').textContent=ios?'En Safari: pulsa Compartir y luego «Añadir a pantalla de inicio».':'En Chrome: abre el menú ⋮ y pulsa «Instalar aplicación» o «Añadir a pantalla de inicio».';
}
function saveCfg(){
  const vals=sel=>[...document.querySelectorAll(sel)].map(x=>x.value);
  cfg=Object.assign({},cfg,{cid:$('#cid').value.trim(),tmdb:$('#tm').value.trim(),wm:$('#wm').value.trim(),cities:vals('.cgrid input:checked'),plats:vals('.pgrid:not(.cgrid) input:checked')});
  ls.set('cfg',cfg);
}

let pollId=0;
function renderPending(){
  const pd=ls.get('pend'),el=$('#dv');
  if(!el||!pd||Date.now()>pd.exp||tok)return;
  el.innerHTML=`<p>Abre <a href="${esc(pd.url)}" target="_blank" rel="noopener">${esc(pd.url)}</a> e introduce este código:</p><div class="code">${esc(pd.uc)}</div><p class="s">Esperando confirmación… al volver a la app se comprueba solo.</p><button class="b" id="newc">Obtener código nuevo</button>`;
  $('#newc').onclick=connect;
}
async function pollDevice(){
  const my=++pollId;
  try{
    for(;;){
      const pd=ls.get('pend');
      if(my!==pollId||!pd)return;
      if(Date.now()>pd.exp)throw new Error('El código ha caducado. Pulsa «Obtener código nuevo».');
      const p=await fetch(API+'/oauth/device/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:pd.dc,client_id:cfg.cid,code_verifier:pd.ver})});
      if(my!==pollId)return;
      if(p.status===200){tok=await p.json();ls.set('tok',tok);ls.set('pend',null);toast('Conectado');setNav();return go('prog')}
      if(p.status===429){pd.iv+=2;ls.set('pend',pd)}
      else if(p.status!==400)throw new Error('Conexión rechazada ('+p.status+'). Pulsa «Obtener código nuevo».');
      await new Promise(r=>setTimeout(r,pd.iv*1000));
    }
  }catch(err){
    if(my===pollId){ls.set('pend',null);if($('#dv'))$('#dv').innerHTML=`<p class="s">${esc(err.message)}</p><button class="b" id="newc">Obtener código nuevo</button>`;if($('#newc'))$('#newc').onclick=connect}
  }
}
async function connect(){
  saveCfg();
  if(!cfg.cid){toast('Falta el Client ID');return}
  try{
    const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const ver=b64(crypto.getRandomValues(new Uint8Array(64)));
    const chal=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
    const r=await fetch(API+'/oauth/device/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:cfg.cid,code_challenge:chal,code_challenge_method:'S256'})});
    if(!r.ok)throw new Error('Trakt rechazó el Client ID ('+r.status+')');
    const d=await r.json();
    ls.set('pend',{dc:d.device_code,uc:d.user_code,url:d.verification_url,iv:d.interval||5,exp:Date.now()+d.expires_in*1000,ver});
    renderPending();pollDevice();
  }catch(err){$('#dv').innerHTML=`<p class="s">${esc(err.message)}</p>`}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ls.get('pend')&&!tok)pollDevice()});

const TABS=[['prog','En Progreso'],['wl','Pendientes'],['cal','Próximos'],['disc','Descubrir'],['hist','Vistos'],['cfg','Ajustes']];
const ICON={prog:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',wl:'<path d="M6 3h12v18l-6-4-6 4z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',disc:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',hist:'<path d="M2 13l4 4L14 8"/><path d="M10 17l1 1L22 8"/>',cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'};
function setNav(){$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t[0]]}</svg></span>${t[1]}</button>`).join('')}
$('#nav').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)go(t.dataset.t)});
async function go(t){
  tab=t;navId++;feedTok++;detailOpen=false;const my=navId;setNav();
  if(feedIO)feedIO.disconnect();
  if(dpush>0){const k=dpush;dpush=0;history.go(-k)}
  $('#h').textContent=TABS.find(x=>x[0]===t)[1];
  window.scrollTo(0,0);
  if(t==='cfg')return cfgView();
  if(!tok){toast('Conecta primero tu cuenta de Trakt');tab='cfg';setNav();return cfgView()}
  $('#v').innerHTML='<div class="msg">Cargando…</div>';
  try{await views[t]()}catch(err){if(my!==navId)return;fail(err,$('#v'))}
}
/* Atrás: una vez cierra la ficha; dos veces seguidas sale de la app */
history.replaceState({root:1},'');history.pushState({app:1},'');
addEventListener('popstate',e=>{
  if(detailOpen){detailOpen=false;dpush=Math.max(0,dpush-1);go(tab);return}
  if(e.state&&e.state.root){
    if(Date.now()-lastBack<2000){history.back();return}
    lastBack=Date.now();toast('Pulsa otra vez atrás para salir');history.pushState({app:1},'');
  }
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const i=$('#intro');if(!i)return;const end=()=>{i.classList.add('out');setTimeout(()=>i.remove(),600)};i.onclick=end;setTimeout(end,2300)})();
if(ls.get('pend')&&!tok)pollDevice();
go(tab);
</script>
